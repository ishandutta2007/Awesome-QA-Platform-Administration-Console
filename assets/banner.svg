<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { opacity: 0.25; transform: scale(0.95); }
      50% { opacity: 0.55; transform: scale(1.08); }
      100% { opacity: 0.25; transform: scale(0.95); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes scanPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashTravel 2s linear infinite;
    }
    .floating-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .status-pulse {
      animation: scanPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Ambient Orbs (Background layer) -->
  <circle class="orb-glow" cx="150" cy="80" r="140" fill="#06b6d4" opacity="0.25" filter="blur(60px)"/>
  <circle class="orb-glow" cx="1050" cy="280" r="180" fill="#8b5cf6" opacity="0.2" filter="blur(70px)"/>
  <circle class="orb-glow" cx="720" cy="60" r="100" fill="#3b82f6" opacity="0.15" filter="blur(50px)"/>

  <!-- Technical Circuit Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Connecting Network Streams -->
  <path class="flow-line" d="M 620 180 C 720 180, 760 110, 850 110" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>
  <path class="flow-line" d="M 620 220 C 720 220, 780 260, 860 260" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Dynamic Floating Graphic Card: Real-time Concurrency Console (Right Top) -->
  <g class="floating-card-1" filter="url(#card-shadow)">
    <rect x="830" y="55" width="310" height="110" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="855" cy="80" r="5" fill="#10b981" class="status-pulse"/>
    <text x="870" y="84" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">QA CLOUD CONCURRENCY</text>
    
    <!-- Concurrency / Cluster Progress Bar -->
    <rect x="855" y="102" width="260" height="7" rx="3.5" fill="#334155"/>
    <rect x="855" y="102" width="195" height="7" rx="3.5" fill="url(#accent-cyan-purple)"/>
    
    <text x="855" y="138" fill="#38bdf8" font-size="12" font-weight="700">75% Capacity</text>
    <text x="965" y="138" fill="#cbd5e1" font-size="11">120/160 Slots Active</text>
  </g>

  <!-- Dynamic Floating Graphic Card: RBAC & Device Access Control (Right Bottom) -->
  <g class="floating-card-2" filter="url(#card-shadow)">
    <rect x="845" y="195" width="300" height="115" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="870" cy="222" r="5" fill="#a855f7" class="status-pulse"/>
    <text x="885" y="226" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">RBAC &amp; DEVICE GOVERNANCE</text>
    
    <!-- Mini Metric Badges -->
    <rect x="868" y="244" width="76" height="24" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="882" y="260" fill="#a5b4fc" font-size="11" font-weight="600">Org Admin</text>

    <rect x="952" y="244" width="76" height="24" rx="5" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="966" y="260" fill="#6ee7b7" font-size="11" font-weight="600">Device Lab</text>

    <rect x="1036" y="244" width="88" height="24" rx="5" fill="#4c1d95" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="1048" y="260" fill="#e9d5ff" font-size="11" font-weight="600">Multi-Tenant</text>

    <text x="870" y="294" fill="#64748b" font-size="11">Identity Provider SSO • Automated Audit</text>
  </g>

  <!-- Left Foreground Content (Strictly in foreground and crystal clear) -->
  <g>
    <!-- Pill Badge -->
    <rect x="70" y="55" width="290" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="85" cy="69" r="4" fill="#06b6d4" class="status-pulse"/>
    <text x="98" y="73" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE QA CONTROL PLANE</text>

    <!-- Main Title -->
    <text x="70" y="145" fill="#f8fafc" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome QA Platform
    </text>
    <text x="70" y="195" fill="url(#accent-cyan-purple)" font-size="38" font-weight="800" letter-spacing="-0.5">
      Administration Console
    </text>

    <!-- Subtitle -->
    <text x="70" y="245" fill="#94a3b8" font-size="15" font-weight="400">
      Curated directory of SaaS &amp; Open-Source QA administration platforms,
    </text>
    <text x="70" y="268" fill="#94a3b8" font-size="15" font-weight="400">
      device lab infrastructure governance, RBAC, and concurrency controls.
    </text>

    <!-- Badges / Tags -->
    <g transform="translate(70, 290)">
      <rect x="0" y="0" width="105" height="24" rx="6" fill="#1e293b"/>
      <text x="12" y="16" fill="#cbd5e1" font-size="11" font-weight="600">⚡ SaaS Clouds</text>

      <rect x="115" y="0" width="135" height="24" rx="6" fill="#1e293b"/>
      <text x="127" y="16" fill="#cbd5e1" font-size="11" font-weight="600">🛡️ Self-Hosted OSS</text>

      <rect x="260" y="0" width="130" height="24" rx="6" fill="#1e293b"/>
      <text x="272" y="16" fill="#cbd5e1" font-size="11" font-weight="600">📊 RBAC &amp; Quotas</text>
    </g>
  </g>
</svg>
